<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-label="Janus">
  <defs>
    <linearGradient id="jRing" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C8CFF"/>
      <stop offset="0.5" stop-color="#B98CFF"/>
      <stop offset="1" stop-color="#54E6FF"/>
    </linearGradient>
  </defs>

  <!-- coin field -->
  <circle cx="128" cy="128" r="100" fill="#0A0B0F"/>
  <!-- gradient border ring -->
  <circle cx="128" cy="128" r="100" fill="none" stroke="url(#jRing)" stroke-width="7"/>
  <circle cx="128" cy="128" r="88" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- shared back-of-head / past|future seam -->
  <line x1="128" y1="58" x2="128" y2="198" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

  <!-- LEFT face (the past) — sharp white line art -->
  <g stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M128 60 C104 60 86 76 82 98 C80 110 70 116 64 126 C72 130 78 130 79 138 C74 146 76 152 84 156 C80 164 86 178 102 186 L128 196"/>
    <path d="M92 112 L106 110"/>
    <path d="M84 150 L96 150"/>
  </g>
  <circle cx="100" cy="120" r="3.4" fill="#FFFFFF"/>

  <!-- RIGHT face (the future), mirror -->
  <g stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M128 60 C152 60 170 76 174 98 C176 110 186 116 192 126 C184 130 178 130 177 138 C182 146 180 152 172 156 C176 164 170 178 154 186 L128 196"/>
    <path d="M164 112 L150 110"/>
    <path d="M172 150 L160 150"/>
  </g>
  <circle cx="156" cy="120" r="3.4" fill="#FFFFFF"/>

  <!-- coin flank marks -->
  <circle cx="128" cy="44" r="2.6" fill="url(#jRing)"/>
  <circle cx="128" cy="212" r="2.6" fill="url(#jRing)"/>
</svg>
