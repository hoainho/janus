<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0056B3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#046307;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2042D;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#logoGrad)" stroke-width="8" filter="url(#glow)"/>
  
  <!-- Diamond shape (Janus two-faced symbol) -->
  <path d="M 60 100 L 100 60 L 140 100 L 100 140 Z" fill="url(#logoGrad)" filter="url(#glow)"/>
  
  <!-- Center circle (unity) -->
  <circle cx="100" cy="100" r="20" fill="url(#logoGrad)" filter="url(#glow)"/>
  
  <!-- Two lines representing past and future -->
  <line x1="100" y1="40" x2="100" y2="80" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="100" y1="120" x2="100" y2="160" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round"/>
</svg>
