[package]
name = "harness-cli"
version = "0.1.10"
edition.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
thiserror = "2.0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.27.0"
